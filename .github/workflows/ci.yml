name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  build-lint-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Consent probe
        run: npm run test:consent